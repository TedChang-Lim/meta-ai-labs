<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>MadCat Agent Sync Dashboard v2</title>
<style>
  :root {
    --bg-color: #0f172a;
    --card-bg: rgba(30, 41, 59, 0.6);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --border-color: rgba(255, 255, 255, 0.1);
    --accent-blue: #3b82f6;
    --accent-green: #10b981;
    --accent-yellow: #f59e0b;
    --accent-red: #ef4444;
    --accent-purple: #8b5cf6;
  }
  body {
    margin: 0; padding: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg-color);
    color: var(--text-primary);
    min-height: 100vh;
    background-image: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 20%),
                      radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 20%);
  }
  .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color);
  }
  h1 {
    margin: 0; font-size: 2rem;
    background: linear-gradient(90deg, #3b82f6, #10b981);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .status-indicator { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: var(--text-secondary); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent-red); box-shadow: 0 0 10px var(--accent-red); }
  .dot.connected { background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }

  .stats-card {
    background: var(--card-bg); backdrop-filter: blur(10px);
    border: 1px solid var(--border-color); border-radius: 16px;
    padding: 30px; margin-bottom: 40px; text-align: center;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
  }
  .stats-value { font-size: 3rem; font-weight: bold; color: var(--accent-green); margin: 10px 0; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
  .agent-card {
    background: var(--card-bg); backdrop-filter: blur(10px);
    border: 1px solid var(--border-color); border-radius: 16px;
    padding: 20px; transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 16px 0 rgba(0, 0, 0, 0.2);
  }
  .agent-card:hover { transform: translateY(-5px); box-shadow: 0 8px 24px 0 rgba(0, 0, 0, 0.3); }
  .agent-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .agent-name { font-size: 1.2rem; font-weight: 600; }

  .status-badge { width: 12px; height: 12px; border-radius: 50%; background: var(--accent-green); }
  .status-badge.busy { background: var(--accent-blue); box-shadow: 0 0 8px var(--accent-blue); }
  .status-badge.waiting { background: var(--accent-yellow); box-shadow: 0 0 8px var(--accent-yellow); }
  .status-badge.idle { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
  .status-badge.error { background: var(--accent-red); box-shadow: 0 0 8px var(--accent-red); }

  .agent-info { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 5px; }

  .messages-panel {
    background: var(--card-bg); backdrop-filter: blur(10px);
    border: 1px solid var(--border-color); border-radius: 16px;
    padding: 30px; margin-bottom: 40px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
  }
  .messages-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color);
  }
  .messages-title { font-size: 1.5rem; font-weight: 600; color: var(--accent-purple); }
  .message-list { max-height: 400px; overflow-y: auto; }
  .message-item {
    background: rgba(15, 23, 42, 0.5); border: 1px solid var(--border-color);
    border-radius: 8px; padding: 15px; margin-bottom: 10px;
    cursor: pointer; transition: all 0.2s;
  }
  .message-item:hover { background: rgba(30, 41, 59, 0.8); transform: translateX(5px); }
  .message-meta { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; }
  .message-filename { color: var(--accent-purple); font-weight: 600; }
  .message-time { color: var(--text-secondary); }
  .message-preview { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.4; }

  .modal {
    display: none; position: fixed; z-index: 1000; left: 0; top: 0;
    width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(5px);
  }
  .modal-content {
    background: var(--bg-color); border: 1px solid var(--border-color);
    border-radius: 16px; padding: 30px; margin: 5% auto;
    width: 80%; max-width: 800px; max-height: 80vh; overflow-y: auto;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-title { font-size: 1.5rem; font-weight: 600; color: var(--accent-purple); }
  .close-btn { background: none; border: none; color: var(--text-secondary); font-size: 2rem; cursor: pointer; }
  .modal-body { color: var(--text-primary); line-height: 1.6; white-space: pre-wrap; font-family: 'Courier New', monospace; }

  .controls { text-align: center; }
  .btn {
    background: rgba(239, 68, 68, 0.1); border: 1px solid var(--accent-red);
    color: var(--accent-red); padding: 10px 20px; border-radius: 8px;
    cursor: pointer; font-weight: 600; transition: all 0.2s; margin: 0 5px;
  }
  .btn:hover { background: var(--accent-red); color: white; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>MadCat Agent Sync Dashboard v2</h1>
    <div class="status-indicator">
      <div class="dot" id="conn-dot"></div>
      <span id="conn-text">Disconnected</span>
    </div>
  </header>

  <div class="stats-card">
    <div style="color: var(--text-secondary); font-size: 1rem;">Today's Saved Cost (Q & Jan)</div>
    <div class="stats-value" id="saved-cost">$0.00</div>
    <div style="color: var(--text-secondary); font-size: 0.9rem;">Token Optimization Active</div>
  </div>

  <div class="grid" id="agents-grid"></div>

  <div class="messages-panel">
    <div class="messages-header">
      <div class="messages-title">Agent Messages</div>
      <button class="btn" onclick="refreshMessages()">새로고침</button>
    </div>
    <div class="message-list" id="message-list">
      <div style="text-align: center; color: var(--text-secondary); padding: 40px;">
        로딩 중...
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" onclick="stopServer()">Shutdown Daemon</button>
  </div>
</div>

<div id="message-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Message Content</div>
      <button class="close-btn" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
  const agents = ["Hena", "AG", "Mimo", "Q", "Jan"];
  let state = {};

  function renderAgents() {
    const grid = document.getElementById('agents-grid');
    grid.innerHTML = '';
    agents.forEach(name => {
      const data = state[name] || { status: 'idle', file: '-', cost: 0.0 };
      const card = document.createElement('div');
      card.className = 'agent-card';
      card.innerHTML = `
        <div class="agent-header">
          <div class="agent-name">${name}</div>
          <div class="status-badge ${data.status}"></div>
        </div>
        <div class="agent-info">Status: <strong>${data.status.toUpperCase()}</strong></div>
        <div class="agent-info">File: ${data.file}</div>
        <div class="agent-info">Cost: $${data.cost.toFixed(4)}</div>
      `;
      grid.appendChild(card);
    });
  }

  async function loadMessages() {
    try {
      const response = await fetch('/messages');
      const data = await response.json();
      renderMessages(data.messages);
    } catch (error) {
      document.getElementById('message-list').innerHTML = `
        <div style="text-align: center; color: var(--accent-red); padding: 40px;">
          서버 연결 실패
        </div>
      `;
    }
  }

  function renderMessages(messages) {
    const list = document.getElementById('message-list');
    if (messages.length === 0) {
      list.innerHTML = `
        <div style="text-align: center; color: var(--text-secondary); padding: 40px;">
          메시지가 없습니다
        </div>
      `;
      return;
    }
    list.innerHTML = '';
    messages.forEach(msg => {
      const item = document.createElement('div');
      item.className = 'message-item';
      item.onclick = () => showMessage(msg.filename);
      item.innerHTML = `
        <div class="message-meta">
          <span class="message-filename">${msg.filename}</span>
          <span class="message-time">${new Date(msg.modified).toLocaleString('ko-KR')}</span>
        </div>
        <div class="message-preview">크기: ${msg.size} bytes</div>
      `;
      list.appendChild(item);
    });
  }

  async function showMessage(filename) {
    try {
      const response = await fetch(`/messages/${filename}`);
      const data = await response.json();
      document.getElementById('modal-title').textContent = filename;
      document.getElementById('modal-body').textContent = data.content;
      document.getElementById('message-modal').style.display = 'block';
    } catch (error) {
      alert('메시지를 불러올 수 없습니다.');
    }
  }

  function closeModal() {
    document.getElementById('message-modal').style.display = 'none';
  }

  function refreshMessages() {
    loadMessages();
  }

  function connectSSE() {
    const dot = document.getElementById('conn-dot');
    const text = document.getElementById('conn-text');
    const evtSource = new EventSource('/stream');

    evtSource.onopen = () => {
      dot.className = 'dot connected';
      text.innerText = 'Connected';
    };

    evtSource.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'init' || data.type === 'update') {
        state = data.agents;
        document.getElementById('saved-cost').innerText = `$${data.saved_cost.toFixed(2)}`;
        renderAgents();
      } else if (data.type === 'message' || data.type === 'archived') {
        loadMessages();
      } else if (data.type === 'stop') {
        evtSource.close();
        dot.className = 'dot';
        text.innerText = 'Server Stopped';
      }
    };

    evtSource.onerror = () => {
      dot.className = 'dot';
      text.innerText = 'Disconnected (Retrying...)';
      evtSource.close();
      setTimeout(connectSSE, 3000);
    };
  }

  function stopServer() {
    if(confirm('정말 매드캣 데몬을 종료하시겠습니까?')) {
      fetch('/stop', { method: 'POST' })
        .then(() => {
          document.getElementById('conn-dot').className = 'dot';
          document.getElementById('conn-text').innerText = 'Server Stopped';
        });
    }
  }

  renderAgents();
  connectSSE();
  loadMessages();
</script>
</body>
</html>
